name: Nightly audit - bugs & lint

on:
  schedule:
    - cron: "20 8 * * *" # ~04:20 America/Toronto
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run bugs & lint audit
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            /audit-bugs-lint
            Commit analysé: ${{ github.sha }}
          claude_args: |
            --model claude-opus-5
            --allowedTools "Read,Grep,Glob,Write(docs/audits/bugs-lint.md),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*)"
            --max-turns 40

      - name: Commit report if changed
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"
          git add docs/audits/bugs-lint.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(audit): nightly bugs & lint report"
            git push
          else
            echo "No changes to commit"
          fi
