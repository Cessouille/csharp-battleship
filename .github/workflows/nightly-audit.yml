name: Nightly audit

on:
  schedule:
    - cron: "10 8 * * *" # ~04:10 America/Toronto
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        audit:
          - id: bugs-lint
            skill: audit-bugs-lint
            report_path: docs/audits/bugs-lint.md
            needs_dotnet: true
            allowed_tools: "Read,Grep,Glob,Write(docs/audits/bugs-lint.md),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*)"
          - id: code-health
            skill: audit-code-health
            report_path: docs/audits/code-health.md
            needs_dotnet: false
            allowed_tools: "Read,Grep,Glob,Write(docs/audits/code-health.md)"
          - id: documentation
            skill: audit-documentation
            report_path: docs/audits/documentation.md
            needs_dotnet: false
            allowed_tools: "Read,Grep,Glob,Write(docs/audits/documentation.md)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        if: matrix.audit.needs_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run ${{ matrix.audit.id }} audit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /${{ matrix.audit.skill }}
            Commit analysé: ${{ github.sha }}
          claude_args: |
            --model claude-opus-5
            --allowedTools "${{ matrix.audit.allowed_tools }}"
            --max-turns 40

      - name: Upload ${{ matrix.audit.id }} report
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.audit.id }}
          path: ${{ matrix.audit.report_path }}
          retention-days: 1

  package-report:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download audit reports
        uses: actions/download-artifact@v4
        with:
          pattern: audit-*
          path: docs/audits
          merge-multiple: true
          if-no-artifact-found: warn

      - name: Publish combined nightly audit report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-report
          path: docs/audits
          retention-days: 30
