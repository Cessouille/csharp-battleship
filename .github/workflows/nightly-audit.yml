name: Nightly audit

on:
  schedule:
    # Le cron GitHub est en UTC et ne connaît pas les fuseaux : 04h00 à Paris
    # vaut 02:00 UTC en heure d'été (CEST, UTC+2) et 03:00 UTC en heure d'hiver
    # (CET, UTC+1). Les deux créneaux sont déclarés, et le garde du job `prepare`
    # ignore celui qui ne correspond pas à l'offset de Paris du jour.
    - cron: "0 2 * * *" # 04h00 à Paris en heure d'été
    - cron: "0 3 * * *" # 04h00 à Paris en heure d'hiver
  workflow_dispatch:
    inputs:
      audit:
        description: "Audit à lancer"
        type: choice
        default: all
        options:
          - all
          - bugs-lint
          - code-health
          - documentation

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # Les deux crons se déclenchent chaque nuit ; un seul correspond à 04h00
      # heure de Paris. On compare l'offset UTC de Paris du jour au cron qui a
      # déclenché ce run — et non l'heure courante, qui dérive avec les retards
      # de planification de GitHub.
      - id: guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGERING_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$(TZ=Europe/Paris date +%z)" in
            +0200) EXPECTED="0 2 * * *" ;; # heure d'été
            *)     EXPECTED="0 3 * * *" ;; # heure d'hiver
          esac
          if [ "$TRIGGERING_CRON" = "$EXPECTED" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cron '$TRIGGERING_CRON' ignoré : à cette période, 04h00 à Paris correspond à '$EXPECTED'."
          fi

      - id: set-matrix
        if: steps.guard.outputs.proceed == 'true'
        env:
          SELECTED: ${{ inputs.audit || 'all' }}
        run: |
          ALL='[
            {"id":"bugs-lint","skill":"audit-bugs-lint","report_path":"docs/audits/bugs-lint.md","needs_dotnet":true,"allowed_tools":"Read,Grep,Glob,Edit(docs/audits/bugs-lint.md),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*)"},
            {"id":"code-health","skill":"audit-code-health","report_path":"docs/audits/code-health.md","needs_dotnet":false,"allowed_tools":"Read,Grep,Glob,Edit(docs/audits/code-health.md)"},
            {"id":"documentation","skill":"audit-documentation","report_path":"docs/audits/documentation.md","needs_dotnet":false,"allowed_tools":"Read,Grep,Glob,Edit(docs/audits/documentation.md)"}
          ]'
          if [ "$SELECTED" = "all" ]; then
            FILTERED="$ALL"
          else
            FILTERED=$(echo "$ALL" | jq -c --arg id "$SELECTED" '[.[] | select(.id == $id)]')
            if [ "$(echo "$FILTERED" | jq 'length')" -eq 0 ]; then
              echo "::error::Audit inconnu: $SELECTED"
              exit 1
            fi
          fi
          MATRIX=$(echo "$FILTERED" | jq -c '{audit: .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  audit:
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        if: matrix.audit.needs_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run ${{ matrix.audit.id }} audit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /${{ matrix.audit.skill }}
            Commit analysé: ${{ github.sha }}
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "${{ matrix.audit.allowed_tools }}"
            --max-turns 100

      - name: Upload ${{ matrix.audit.id }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.audit.id }}
          path: ${{ matrix.audit.report_path }}
          if-no-files-found: warn
          retention-days: 1

  package-report:
    needs: [prepare, audit]
    if: always() && needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download audit reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: audit-*
          path: docs/audits
          merge-multiple: true

      - name: Ensure report directory has content
        run: |
          mkdir -p docs/audits
          if [ -z "$(ls -A docs/audits)" ]; then
            echo "Aucun rapport d'audit n'a été généré (toutes les jobs d'audit ont échoué ou n'ont produit aucun fichier)." > docs/audits/AUCUN_RAPPORT.md
          fi

      - name: Publish combined nightly audit report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-report
          path: docs/audits
          retention-days: 30
