name: Nightly audit

on:
  schedule:
    - cron: "10 8 * * *" # ~04:10 America/Toronto
  workflow_dispatch:
    inputs:
      audit:
        description: "Audit à lancer"
        type: choice
        default: all
        options:
          - all
          - bugs-lint
          - code-health
          - documentation

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          SELECTED: ${{ inputs.audit || 'all' }}
        run: |
          ALL='[
            {"id":"bugs-lint","skill":"audit-bugs-lint","report_path":"docs/audits/bugs-lint.md","needs_dotnet":true,"allowed_tools":"Read,Grep,Glob,Edit(docs/audits/bugs-lint.md),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*)"},
            {"id":"code-health","skill":"audit-code-health","report_path":"docs/audits/code-health.md","needs_dotnet":false,"allowed_tools":"Read,Grep,Glob,Edit(docs/audits/code-health.md)"},
            {"id":"documentation","skill":"audit-documentation","report_path":"docs/audits/documentation.md","needs_dotnet":false,"allowed_tools":"Read,Grep,Glob,Edit(docs/audits/documentation.md)"}
          ]'
          if [ "$SELECTED" = "all" ]; then
            FILTERED="$ALL"
          else
            FILTERED=$(echo "$ALL" | jq -c --arg id "$SELECTED" '[.[] | select(.id == $id)]')
            if [ "$(echo "$FILTERED" | jq 'length')" -eq 0 ]; then
              echo "::error::Audit inconnu: $SELECTED"
              exit 1
            fi
          fi
          MATRIX=$(echo "$FILTERED" | jq -c '{audit: .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  audit:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        if: matrix.audit.needs_dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run ${{ matrix.audit.id }} audit
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /${{ matrix.audit.skill }}
            Commit analysé: ${{ github.sha }}
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "${{ matrix.audit.allowed_tools }}"
            --max-turns 60

      - name: Upload ${{ matrix.audit.id }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.audit.id }}
          path: ${{ matrix.audit.report_path }}
          if-no-files-found: warn
          retention-days: 1

  package-report:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download audit reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: audit-*
          path: docs/audits
          merge-multiple: true

      - name: Ensure report directory has content
        run: |
          mkdir -p docs/audits
          if [ -z "$(ls -A docs/audits)" ]; then
            echo "Aucun rapport d'audit n'a été généré (toutes les jobs d'audit ont échoué ou n'ont produit aucun fichier)." > docs/audits/AUCUN_RAPPORT.md
          fi

      - name: Publish combined nightly audit report
        uses: actions/upload-artifact@v4
        with:
          name: nightly-audit-report
          path: docs/audits
          retention-days: 30
