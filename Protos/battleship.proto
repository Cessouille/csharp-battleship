syntax = "proto3";
option csharp_namespace = "BattleShip.Grpc";
package battleship;

service Battleship {
  rpc GetGameState (GetGameStateRequest) returns (GameStateReply);
  // Action mutante : consomme un scan et le tour du joueur (voir docs/adr/0010-radar-grpc-web.md).
  rpc ScanZone (ScanZoneRequest) returns (ScanZoneReply);
  // Action mutante : salve du joueur en mode Salvo, en plus du POST /salvos REST (voir docs/adr/0014-salvo-grpc-web.md).
  rpc PlaySalvo (PlaySalvoRequest) returns (PlaySalvoReply);
}

message GetGameStateRequest {
  string game_id = 1; // GUID sous forme de chaîne
}

message CoordinateMessage {
  int32 row = 1;
  int32 column = 2;
}

message ShipMessage {
  string kind = 1;
  repeated CoordinateMessage cells = 2;
  bool is_sunk = 3;
}

message MyBoardMessage {
  int32 size = 1;
  repeated ShipMessage ships = 2;
  repeated CoordinateMessage cells_hit_by_opponent = 3;
}

message ScanMessage {
  CoordinateMessage origin = 1; // coin haut-gauche de la zone 2x2
  bool ship_detected = 2;
}

message OpponentBoardMessage {
  int32 size = 1;
  repeated CoordinateMessage hits = 2;
  repeated CoordinateMessage misses = 3;
  repeated ShipMessage sunk_ships = 4;
  repeated ScanMessage scans = 5;
}

message GameOptionsMessage {
  bool radar = 1;
  string shot_mode = 2; // "Classic" | "Salvo"
  bool special_weapons = 3;
  string difficulty = 4; // "Easy" | "Medium" | "Hard"
}

message ArsenalMessage {
  int32 torpedoes = 1;
  int32 air_strikes = 2;
}

message PlayerActionsMessage {
  int32 scans_remaining = 1;
  int32 salvo_size = 2; // tirs exigés au prochain tour (1 en classique)
  ArsenalMessage arsenal = 3;
  ArsenalMessage opponent_arsenal = 4;
}

message GameStateReply {
  string game_id = 1;
  string status = 2;   // "InProgress" | "Finished"
  string winner = 3;   // "" si aucun
  MyBoardMessage my_board = 4;
  OpponentBoardMessage opponent_board = 5;
  GameOptionsMessage options = 6;
  PlayerActionsMessage actions = 7;
  repeated JournalEntryMessage history = 8; // TICKET-10 : journal chronologique, survit au rechargement
  repeated string achievements = 9; // TICKET-12 : identifiants de succès débloqués (voir docs/adr/0017-systeme-de-succes.md)
}

message JournalEntryMessage {
  repeated ShotResultMessage player_shots = 1;
  ScanMessage player_scan = 2;
  string player_weapon = 3;   // "" si aucune
  repeated ShotResultMessage computer_shots = 4;
  string computer_weapon = 5; // "" si aucune
}

message ScanZoneRequest {
  string game_id = 1;
  int32 row = 2;    // coin haut-gauche de la zone
  int32 column = 3;
}

message ShotResultMessage {
  CoordinateMessage target = 1;
  string outcome = 2;         // "Miss" | "Hit" | "Sunk"
  string sunk_ship_kind = 3;  // "" si aucun
}

message ScanZoneReply {
  ScanMessage scan = 1;
  repeated ShotResultMessage computer_shots = 2;
  GameStateReply state = 3;
  string computer_weapon = 4; // "" si l'ordinateur a répliqué par un tir classique
}

message PlaySalvoRequest {
  string game_id = 1;
  repeated CoordinateMessage shots = 2;
}

message PlaySalvoReply {
  repeated ShotResultMessage player_shots = 1;
  repeated ShotResultMessage computer_shots = 2;
  GameStateReply state = 3;
  string computer_weapon = 4; // "" si l'ordinateur a répliqué par un tir classique
}
